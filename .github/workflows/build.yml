name: build

on:
  push:
  pull_request:
  workflow_dispatch:

# One run per ref; a newer push cancels an in-flight one.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lean:
    name: lake build + axiom audit (Lean 4.35.0 + Mathlib)
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      # Installs elan, honours `lean-toolchain`, fetches the Mathlib cache,
      # and runs `lake build` on the default target `Entropic`.
      - name: Build
        uses: leanprover/lean-action@v1
        with:
          use-mathlib-cache: true
          test: false

      - name: Fail on any `sorry`, `native_decide` or project axiom
        run: |
          set -o pipefail
          lake build 2>&1 | tee build.log
          if grep -q "declaration uses 'sorry'" build.log; then
            echo "::error::build log contains a 'declaration uses sorry' warning"; exit 1
          fi
          python3 tools/scan_sources.py

      # Every theorem may depend only on propext, Classical.choice, Quot.sound.
      - name: Axiom audit
        run: |
          set -o pipefail
          lake env lean scripts/AxiomAudit.lean 2>&1 | tee axiom-footprint.txt
          grep -q "Entropic: .* theorems; 0 with nonstandard axioms" axiom-footprint.txt
          grep -q "Entropic.EFT: .* theorems; 0 with nonstandard axioms" axiom-footprint.txt

      # Every Lean name cited in ledger/LEDGER.md exists in the library.
      - name: Ledger citation check
        run: |
          set -o pipefail
          lake env lean scripts/CiteCheck.lean 2>&1 | tail -1 | tee citecheck.txt
          grep -q "unresolved 0" citecheck.txt

      - name: Upload audit logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: audit-logs
          path: |
            axiom-footprint.txt
            citecheck.txt
          if-no-files-found: warn

  audit:
    name: python audit (independent re-derivation)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: python -m pip install --upgrade pip scipy

      - name: Delimiter sanity
        run: python tools/syntax_sanity.py

      # Re-enumerates the 1,680 states and re-derives the spectrum, the H.9
      # decomposition, eta*, L*, G*, and the lepton ratios from scratch in
      # Python: an independent check that the Lean definitions of Entropic.EFT
      # say what the manuscript says they say. This is not the Lean kernel.
      - name: Deterministic audit
        run: python tools/audit.py
